name: CI Security & Quality Gates

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Token Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Root NPM Audit
        run: npm audit --audit-level=high

      - name: Run Frontend NPM Audit
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=high

  test-suite:
    name: Automated Test Verification Gates
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: airvix_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long-security
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BACKUP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      META_APP_SECRET: ci-mock-meta-app-secret-1234567890
      META_WEBHOOK_VERIFY_TOKEN: ci-mock-verify-token
      RAZORPAY_WEBHOOK_SECRET: ci-mock-razorpay-webhook-secret
      STRIPE_WEBHOOK_SECRET: ci-mock-stripe-webhook-secret
      REDIS_URL: redis://127.0.0.1:6380
      DATABASE_URL: postgresql://postgres@127.0.0.1:5433/airvix_test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Pre-installed Host Services
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl stop redis-server || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify Service Connectivity
        run: |
          node -e "
            const { Pool } = require('pg');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            pool.query('SELECT 1').then(() => {
              console.log('✅ PostgreSQL service connected at ' + process.env.DATABASE_URL);
              process.exit(0);
            }).catch(err => {
              console.error('❌ PostgreSQL connection failed:', err.message);
              process.exit(1);
            });
          "

      - name: Run Database Migration Unit Tests
        run: |
          node tests/migrator.test.js 2>&1 | tee /tmp/migrator.log || {
            echo "::error title=MigratorTestFailure::$(tail -n 25 /tmp/migrator.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Backup & Recovery Unit Tests
        run: |
          node tests/backupRecovery.test.js 2>&1 | tee /tmp/backup.log || {
            echo "::error title=BackupTestFailure::$(tail -n 25 /tmp/backup.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Multi-Tenant Security Tests
        run: |
          node tests/multiTenantSecurity.test.js 2>&1 | tee /tmp/multitenant.log || {
            echo "::error title=MultiTenantTestFailure::$(tail -n 25 /tmp/multitenant.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Webhook Reliability & DLQ Tests
        run: |
          node tests/webhookReliability.test.js 2>&1 | tee /tmp/webhook.log || {
            echo "::error title=WebhookTestFailure::$(tail -n 25 /tmp/webhook.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Billing & Subscription Tests
        run: |
          node tests/billingAndSubscription.test.js 2>&1 | tee /tmp/billing.log || {
            echo "::error title=BillingTestFailure::$(tail -n 25 /tmp/billing.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Admin Security & MFA Tests
        run: |
          node tests/adminSecurity.test.js 2>&1 | tee /tmp/admin.log || {
            echo "::error title=AdminTestFailure::$(tail -n 25 /tmp/admin.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Observability & Telemetry Tests
        run: |
          node tests/observability.test.js 2>&1 | tee /tmp/observability.log || {
            echo "::error title=ObservabilityTestFailure::$(tail -n 25 /tmp/observability.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Run Account Health & Automation Risk Monitoring Tests
        run: |
          node tests/accountHealthAndRiskMonitoring.test.js 2>&1 | tee /tmp/accounthealth.log || {
            echo "::error title=AccountHealthTestFailure::$(tail -n 25 /tmp/accounthealth.log | tr '\n' ' | ')"
            exit 1
          }

  build-check:
    name: Frontend Build & Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Application
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

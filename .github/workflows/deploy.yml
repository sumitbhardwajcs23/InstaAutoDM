name: Continuous Deployment & Automated Rollback

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || inputs.target_env == 'staging'
    environment:
      name: staging
      url: https://staging-api.airvix.ai
    env:
      NODE_ENV: staging
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_TOKEN_ENCRYPTION_KEY }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations (Expand Phase)
        run: node backend/src/db/migrator.js up

      - name: Deploy Staging Application
        run: |
          echo "Deploying application to Staging cluster..."
          # Integrates with deployment provider (e.g. Render, Railway, AWS ECS)
          # render deploy --service srv-staging

      - name: Verify Staging Readiness Probe
        run: |
          echo "Verifying health check probe at /health/ready..."
          # Retry probe up to 10 times with exponential backoff
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.airvix.ai/health/ready || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Staging deployment healthy and ready!"
              exit 0
            fi
            echo "Probe returned $STATUS, retrying in 5s... ($i/10)"
            sleep 5
          done
          echo "Staging health probe failed!"
          exit 1

  deploy-production:
    name: Deploy to Production Environment (Protected)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' || inputs.target_env == 'production'
    environment:
      name: production
      url: https://api.airvix.ai
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.PROD_TOKEN_ENCRYPTION_KEY }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.PROD_BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Deployment Encrypted Database Backup
        run: |
          echo "Executing automated safety backup prior to migration..."
          node backend/src/scripts/backupDb.js

      - name: Apply Database Migrations (Expand Phase)
        id: run_migrations
        run: node backend/src/db/migrator.js up

      - name: Deploy Production Application
        id: deploy_app
        run: |
          echo "Deploying release to production cluster..."
          # Deploy container to production orchestration platform
          # render deploy --service srv-production

      - name: Verify Production Readiness Probe
        id: health_check
        run: |
          echo "Testing /health/ready endpoint..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.airvix.ai/health/ready || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Production deployment verified successfully!"
              exit 0
            fi
            echo "Health check attempt $i returned $STATUS. Waiting 5 seconds..."
            sleep 5
          done
          echo "CRITICAL: Production health probe failed!"
          exit 1

      - name: Automated Rollback on Deployment Failure
        if: failure() && steps.run_migrations.outcome == 'success'
        run: |
          echo "ALERT: Deployment verification failed. Initiating automated zero-downtime rollback..."
          # 1. Rollback application to previous stable release image
          echo "Reverting application container to previous stable tag..."
          
          # 2. Revert recent database migration
          echo "Reverting latest migration..."
          node backend/src/db/migrator.js down
          
          # 3. Notify Incident Channel
          echo "Automated rollback completed. Triggering on-call PagerDuty incident..."

[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api calls directly to live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://instaautodm-kh61.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

services:
  - type: web
    name: instautoreply-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FREE_PLAN_DM_LIMIT
        value: "1000"
      - key: META_MOCK_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      # Instagram API with Instagram Login issues its OWN app id/secret pair —
      # these are DIFFERENT from META_APP_ID/META_APP_SECRET above and must both
      # be set for "Continue with Instagram" (oauth/start -> oauth/callback) to work.
      # Find them in Meta Developer Portal > your app > Instagram > API setup.
      - key: META_IG_APP_ID
        sync: false
      - key: META_IG_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_REDIRECT_URI
        sync: false

